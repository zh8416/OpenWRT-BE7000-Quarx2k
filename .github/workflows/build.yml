name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget time

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd owrt
          cp ../repo/config.be7000-nand .config
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig
          echo "packages as modules: $(grep -c '=m$' .config)"
          echo "===== package states ====="
          grep -E "^(CONFIG_PACKAGE_|# CONFIG_PACKAGE_)" .config | sort

      - name: Download sources
        run: make -j"$(nproc)" download

      - name: Build
        run: make -j"$(nproc)" world

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            bin/targets/qualcommbe/ipq95xx/*.ubi
            bin/targets/qualcommbe/ipq95xx/*.bin
            bin/targets/qualcommbe/ipq95xx/*.manifest
          if-no-files-found: error
